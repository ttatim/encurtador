name: PHP 8.3 checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  php-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, fileinfo, pdo_mysql
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Smoke tests
        run: php tests/smoke.php
